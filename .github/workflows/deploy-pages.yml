name: Deploy Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Check custom domain
        run: |
          curl --fail --location --retry 12 --retry-all-errors --retry-delay 10 \
            --silent --show-error https://www.offeringprotocol.org/ >/dev/null
          curl --fail --location --retry 12 --retry-all-errors --retry-delay 10 \
            --silent --show-error \
            https://www.offeringprotocol.org/schemas/service-document.schema.json >/dev/null
