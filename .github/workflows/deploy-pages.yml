name: Deploy Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: ietf

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ietf/requirements.txt

      - name: Install PDF system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 \
            libpangocairo-1.0-0 \
            libgdk-pixbuf-2.0-0 \
            libffi-dev \
            shared-mime-info \
            fonts-noto

      - name: Install Python tooling
        working-directory: ietf
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt

      - name: Render release artifacts
        run: make -C ietf render

      - name: Publish latest release artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest artifacts/draft-* --clobber
            gh release edit latest \
              --draft=false \
              --target "${GITHUB_SHA}" \
              --title "Latest ODP specification artifacts" \
              --notes "Generated from commit ${{ github.sha }}." \
              --latest
          else
            gh release create latest artifacts/draft-* \
              --target "${GITHUB_SHA}" \
              --title "Latest ODP specification artifacts" \
              --notes "Generated from commit ${{ github.sha }}." \
              --latest
          fi

          git tag --force latest "${GITHUB_SHA}"
          git push --force origin refs/tags/latest

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Check custom domain
        run: |
          curl --fail --location --retry 12 --retry-all-errors --retry-delay 10 \
            --silent --show-error https://www.offeringprotocol.org/ >/dev/null
          curl --fail --location --retry 12 --retry-all-errors --retry-delay 10 \
            --silent --show-error \
            https://www.offeringprotocol.org/schemas/service-document.schema.json >/dev/null
