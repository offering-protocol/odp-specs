name: Interoperability

on:
  workflow_dispatch:
    inputs:
      node_ref:
        description: odp-node Git reference
        default: main
        required: true
        type: string
      go_ref:
        description: odp-go Git reference
        default: main
        required: true
        type: string
      java_ref:
        description: odp-java Git reference
        default: main
        required: true
        type: string
      python_ref:
        description: odp-python Git reference
        default: main
        required: true
        type: string
      rust_ref:
        description: odp-rust Git reference
        default: main
        required: true
        type: string

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: offering-protocol/odp-node
          ref: ${{ inputs.node_ref }}
          path: .interoperability/odp-node

      - uses: actions/checkout@v7
        with:
          repository: offering-protocol/odp-go
          ref: ${{ inputs.go_ref }}
          path: .interoperability/odp-go

      - uses: actions/checkout@v7
        with:
          repository: offering-protocol/odp-java
          ref: ${{ inputs.java_ref }}
          path: .interoperability/odp-java

      - uses: actions/checkout@v7
        with:
          repository: offering-protocol/odp-python
          ref: ${{ inputs.python_ref }}
          path: .interoperability/odp-python

      - uses: actions/checkout@v7
        with:
          repository: offering-protocol/odp-rust
          ref: ${{ inputs.rust_ref }}
          path: .interoperability/odp-rust

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - uses: pnpm/action-setup@v6
        with:
          version: 11.1.3

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: .interoperability/odp-node/pnpm-lock.yaml

      - uses: actions/setup-go@v7
        with:
          go-version: 1.25.x
          cache-dependency-path: .interoperability/odp-go/go.sum

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: .interoperability/odp-java/pom.xml

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.11.8"
          enable-cache: true
          cache-dependency-glob: .interoperability/odp-python/uv.lock

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal

      - name: Prepare SDKs
        run: |
          pnpm --dir .interoperability/odp-node install --frozen-lockfile
          pnpm --dir .interoperability/odp-node build
          .interoperability/odp-java/mvnw --batch-mode --no-transfer-progress \
            -f .interoperability/odp-java/pom.xml -DskipTests install
          uv sync --directory .interoperability/odp-python --all-groups --locked --python 3.14
          cargo build --manifest-path .interoperability/odp-rust/Cargo.toml --workspace --locked

      - name: Run all-pairs matrix
        run: ruby ietf/scripts/run_interoperability_matrix.rb
        env:
          ODP_GO_DIR: ${{ github.workspace }}/.interoperability/odp-go
          ODP_JAVA_DIR: ${{ github.workspace }}/.interoperability/odp-java
          ODP_NODE_DIR: ${{ github.workspace }}/.interoperability/odp-node
          ODP_PYTHON_DIR: ${{ github.workspace }}/.interoperability/odp-python
          ODP_RUST_DIR: ${{ github.workspace }}/.interoperability/odp-rust

      - name: Upload interoperability report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: odp-sdk-interoperability
          path: .interoperability/reports
          if-no-files-found: error
          retention-days: 30
